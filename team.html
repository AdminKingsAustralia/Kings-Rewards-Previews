,pending:450,deliveries:450}[key];if(points===undefined)points=450;return{points:points,credit:0,vouchers:[],verified:key!=='pending',welcomeUsed:!['new','pending'].includes(key),deliveriesUsed:key==='deliveries'?3:key==='new'?0:1,history:points?[{title:key==='refund'?'Refund adjustment after earlier redemption':'Earlier eligible purchases',detail:key==='refund'?'Remaining adjustment is offset by future points.':'Sample opening balance',points:points}]:[],orders:[],keys:[],next:1};}\nfunction nextReward(points){return tiers.find(function(t){return t.points>points;})||null;}\nfunction redeem(s,cost,key){var t=tiers.find(function(t){return t.points===cost;});if(!t)throw Error('Unknown reward.');if(!s.verified)throw Error('Verify membership before redeeming.');if(s.keys.includes(key))return s;if(s.points<cost)throw Error('Not enough available points.');var n=JSON.parse(JSON.stringify(s));n.points-=cost;n.keys.push(key);if(t.type==='credit')n.credit+=t.cents;else n.vouchers.push({id:'V'+n.next++,cents:t.cents});n.history.unshift({title:t.type==='credit'?'Store credit added':'$10 discount reward claimed',detail:money(t.cents)+(t.type==='credit'?' added to your credit balance':' discount available for a future order'),points:-cost});return n;}\nfunction purchase(s,cents){if(!Number.isSafeInteger(cents)||cents<100||cents>1000000)throw Error('Enter a product subtotal between $1 and $10,000.');if(!s.verified)throw Error('Verify membership before earning member points.');var n=JSON.parse(JSON.stringify(s));var discount=!n.welcomeUsed&&cents>=5000?Math.min(Math.round(cents*.25),4000):0;var paid=cents-discount;var earned=Math.floor(paid/100);var order={id:n.next++,subtotal:cents,paid:paid,discount:discount,earned:earned,refunded:false,delivered:false,freeDelivery:cents>=(n.deliveriesUsed<3?5000:15000),intro:n.deliveriesUsed<3&&cents>=5000};if(order.intro&&n.orders.some(function(o){return o.intro&&!o.delivered&&!o.refunded;}))throw Error('Complete or refund the pending delivery before starting another in this demo.');n.orders.unshift(order);n.points+=earned;if(discount)n.welcomeUsed=true;n.history.unshift({title:'Points earned \u00b7 demo order #'+order.id,detail:money(paid)+' eligible product spend'+(discount?' after '+money(discount)+' welcome saving':''),points:earned});return n;}\nfunction completeDelivery(s){var n=JSON.parse(JSON.stringify(s));var order=n.orders.find(function(o){return !o.delivered&&!o.refunded;});if(!order)throw Error('No paid demo order is awaiting delivery.');order.delivered=true;if(order.intro)n.deliveriesUsed++;n.history.unshift({title:'Delivery completed \u00b7 demo order #'+order.id,detail:order.intro?'One introductory delivery used':order.freeDelivery?'Ongoing free delivery applied':'Standard delivery fee applies',points:0});return n;}\nfunction refund(s){var n=JSON.parse(JSON.stringify(s));var order=n.orders.find(function(o){return !o.refunded;});if(!order)throw Error('No demo order is available to refund.');order.refunded=true;n.points-=order.earned;n.history.unshift({title:'Refund \u00b7 demo order #'+order.id,detail:money(order.paid)+' products refunded; earned points reversed. Welcome use retained.',points:-order.earned});return n;}\nfunction money(c){return '$'+(c/100).toFixed(2);}\nfunction mount(doc){var state=seed('near'),pending=null;var dialog=doc.getElementById('redeem-dialog'),status=doc.getElementById('demo-status');function text(id,s){doc.getElementById(id).textContent=s;}function say(s){status.textContent=s;}function run(fn){try{state=fn(state);render();}catch(e){say(e.message);}}function render(){var available=Math.max(0,state.points),next=nextReward(available);text('points',available.toLocaleString());text('credit',money(state.credit));text('deliveries',Math.max(0,3-state.deliveriesUsed));text('delivery-title',state.deliveriesUsed>=3?'Your ongoing delivery benefit':'Your first three, on us.');text('delivery-note',state.deliveriesUsed>=3?'Free delivery on orders $150+ in approved areas.':'Free delivery on orders $50+ in approved areas.');text('member-state',state.verified?'KINGS MEMBER':'VERIFICATION PENDING');text('welcome-state',state.welcomeUsed?'Already enjoyed':'Available on your first qualifying order');text('progress-label',next?(next.points-available).toLocaleString()+' points to your next reward':'All reward milestones unlocked');text('progress-detail',next?'Save for '+money(next.cents)+' '+(next.type==='credit'?'credit':'off')+' at '+next.points.toLocaleString()+' points.':'Choose a reward below, or keep saving.');var progress=doc.getElementById('milestone');progress.max=next?next.points:2500;progress.value=next?available:2500;text('progress-fraction',next?available.toLocaleString()+' / '+next.points.toLocaleString()+' points':'2,500+ points');text('balance-note',state.points<0?'A '+Math.abs(state.points)+'-point refund adjustment will be offset by future earnings.':state.verified?'Earn 1 point per eligible $1 spent. Your points stay until redeemed.':'Please verify your email to use your membership.');doc.querySelectorAll('[data-redeem]').forEach(function(b){var cost=Number(b.dataset.redeem);b.disabled=!state.verified||available<cost;b.textContent=!state.verified?'Verify membership':available>=cost?'Choose this reward \u2192':(cost-available).toLocaleString()+' more points';});var vouchers=doc.getElementById('vouchers');vouchers.replaceChildren();state.vouchers.forEach(function(v){var li=doc.createElement('li');li.textContent=money(v.cents)+' discount reward \u00b7 '+v.id+' \u00b7 available';vouchers.appendChild(li);});if(!state.vouchers.length){var empty=doc.createElement('li');empty.textContent='Claimed discount rewards will appear here.';vouchers.appendChild(empty);}var activity=doc.getElementById('activity');activity.replaceChildren();state.history.slice(0,8).forEach(function(h){var li=doc.createElement('li'),info=doc.createElement('div'),strong=doc.createElement('strong'),detail=doc.createElement('span'),amount=doc.createElement('b');stron
